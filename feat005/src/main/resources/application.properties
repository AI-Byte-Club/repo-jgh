spring.application.name=feat005

# MySQL Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/feat005?serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Resilience4j - Retry Settings
resilience4j.retry.instances.externalRetry.max-attempts=3
resilience4j.retry.instances.externalRetry.wait-duration=2s
resilience4j.retry.instances.externalRetry.enable-exponential-backoff=false

# Resilience4j - CircuitBreaker Settings
resilience4j.circuitbreaker.instances.externalCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.externalCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.externalCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.externalCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.externalCircuitBreaker.permitted-number-of-calls-in-half-open-state=3

# Resilience4j - Bulkhead Settings
resilience4j.bulkhead.instances.externalBulkhead.max-concurrent-calls=5
resilience4j.bulkhead.instances.externalBulkhead.max-wait-duration=0

# Logging for Resilience4j events
logging.level.io.github.resilience4j=DEBUG
