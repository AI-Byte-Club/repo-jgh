<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 2rem; }
        .info-group {
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
        }
        .label {
            font-size: 0.85rem;
            color: #777;
            margin-bottom: 0.3rem;
        }
        .value {
            font-size: 1.1rem;
            color: #333;
            font-weight: 600;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 0.5rem;
        }
        .logout-btn {
            width: 100%;
            padding: 1rem;
            background-color: #ff4b2b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
            margin-top: 1rem;
        }
        .logout-btn:hover { background-color: #ff416c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>마이페이지</h2>
        
        <div class="info-group">
            <div class="label">사용자명</div>
            <div id="username-display" class="value">-</div>
        </div>

        <div class="info-group">
            <div class="label">회원 등급</div>
            <div id="role-badge" class="role-badge">-</div>
        </div>

        <div id="menu-section" style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1.5rem;">
            <p style="font-size: 0.9rem; color: #666; margin-bottom: 1rem;">등급별 전용 페이지</p>
            <div id="admin-btn" class="menu-item" style="display:none;"><a href="/admin" class="btn" style="background:#fff0f3; color:#e91e63; border:1px solid #ffccd5;">🛠️ 유저 관리 시스템 (ADMIN)</a></div>
            <div id="vip-btn" class="menu-item" style="display:none;"><a href="/page/vip" class="btn">VIP 전용 페이지</a></div>
            <div id="premium-btn" class="menu-item" style="display:none;"><a href="/page/premium" class="btn">Premium 전용 페이지</a></div>
            <div id="basic-btn" class="menu-item" style="display:none;"><a href="/page/basic" class="btn">Basic 공용 페이지</a></div>
        </div>

        <button onclick="auth.logout()" class="logout-btn">로그아웃</button>
    </div>

    <style>
        .menu-item { margin-bottom: 0.8rem; }
        .btn {
            display: block;
            padding: 0.8rem;
            background: #f0f2f5;
            color: #333;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #e4e6e9; }
    </style>

    <script src="/js/auth.js"></script>
    <script>
        // 인증 체크
        auth.checkAuth();

        // 정보 표시
        const username = auth.getUsername();
        const role = auth.getRole();

        if (username) {
            document.getElementById('username-display').innerText = username;
        }

        if (role) {
            const roleBadge = document.getElementById('role-badge');
            roleBadge.innerText = role.replace('ROLE_USER_', '').replace('ROLE_', '');
            
            // 등급별 색상
            if (role === 'ROLE_ADMIN') roleBadge.style.background = '#e91e63';
            else if (role === 'ROLE_USER_VIP') roleBadge.style.background = '#ff9800';
            else if (role === 'ROLE_USER_PREMIUM') roleBadge.style.background = '#4caf50';
            else roleBadge.style.background = '#9e9e9e';

            // 권한별 메뉴 노출 (계층 구조)
            if (role === 'ROLE_ADMIN') {
                document.getElementById('admin-btn').style.display = 'block';
            }
            if (role === 'ROLE_ADMIN' || role === 'ROLE_USER_VIP') {
                document.getElementById('vip-btn').style.display = 'block';
            }
            if (role === 'ROLE_ADMIN' || role === 'ROLE_USER_VIP' || role === 'ROLE_USER_PREMIUM') {
                document.getElementById('premium-btn').style.display = 'block';
            }
            // 모든 로그인 유저는 Basic 접근 가능
            document.getElementById('basic-btn').style.display = 'block';
        }
    </script>
</body>
</html>
