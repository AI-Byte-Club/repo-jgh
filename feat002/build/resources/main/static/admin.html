<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 유저 관리</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; padding: 2rem; }
        .admin-container { max-width: 900px; margin: 0 auto; background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #e91e63; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #555; }
        .role-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; color: white; }
        .back-btn { display: inline-block; margin-bottom: 1rem; color: #1a73e8; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="admin-container">
        <a href="/mypage" class="back-btn">← 마이페이지로</a>
        <h2>👥 전체 유저 관리 시스템</h2>
        <table id="user-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>사용자명</th>
                    <th>현재 권한/등급</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <!-- JS로 데이터 삽입 -->
            </tbody>
        </table>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        auth.checkAuth();
        if (auth.getRole() !== 'ROLE_ADMIN') {
            alert('관리자만 접근 가능합니다!');
            window.location.href = '/mypage';
        }

        async function loadUsers() {
            const response = await auth.fetchWithAuth('/api/admin/members');
            if (response && response.ok) {
                const users = await response.json();
                const userList = document.getElementById('user-list');
                userList.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.username}</td>
                        <td><span class="role-badge" style="background:${getRoleColor(user.role)}">${user.role.replace('ROLE_', '')}</span></td>
                    </tr>
                `).join('');
            }
        }

        function getRoleColor(role) {
            if (role === 'ROLE_ADMIN') return '#e91e63';
            if (role === 'ROLE_USER_VIP') return '#ff9800';
            if (role === 'ROLE_USER_PREMIUM') return '#4caf50';
            return '#9e9e9e';
        }

        loadUsers();
    </script>
</body>
</html>
