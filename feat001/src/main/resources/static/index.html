<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Todo</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .completed { text-decoration: line-through; color: #9ca3af; }
        .todo-item:hover .action-buttons { opacity: 1; }
        .action-buttons { opacity: 0; transition: opacity 0.2s; }
        .custom-checkbox:checked + .checkbox-visual { background-color: #6366f1; border-color: #6366f1; }
        .custom-checkbox:checked + .checkbox-visual::after { content: '✓'; color: white; display: block; text-align: center; font-size: 10px; line-height: 18px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl shadow-slate-200/60 overflow-hidden">
        <!-- Header -->
        <div class="px-8 pt-8 pb-6">
            <div class="flex justify-between items-center mb-1">
                <h1 class="text-2xl font-bold text-slate-800">My Tasks</h1>
                <span id="currentDate" class="text-sm font-medium text-slate-400"></span>
            </div>
            <p class="text-slate-400 text-sm">Stay organized and productive.</p>
        </div>

        <!-- Add Todo Input -->
        <div class="px-8 mb-6">
            <div class="relative group">
                <input type="text" id="todoInput" 
                    placeholder="Add a new task..." 
                    class="w-full pl-4 pr-12 py-3 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:bg-white transition-all text-slate-700 placeholder:text-slate-400">
                <button onclick="addTodo()" 
                    class="absolute right-2 top-1.5 p-1.5 bg-indigo-500 text-white rounded-lg hover:bg-indigo-600 transition-colors">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>
        </div>

        <!-- Todo List -->
        <div class="px-6 pb-8">
            <ul id="todoList" class="space-y-1">
                <!-- Todos will be injected here -->
            </ul>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8081/api/todos';

        // Set Current Date
        function updateDate() {
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            const today = new Date();
            document.getElementById('currentDate').innerText = today.toLocaleDateString('en-US', options);
        }

        async function fetchTodos() {
            const res = await fetch(API_URL);
            const todos = await res.json();
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            
            todos.forEach(todo => {
                const li = document.createElement('li');
                li.className = 'todo-item group';
                
                let html = `
                    <div class="flex flex-col py-2">
                        <div class="flex items-center justify-between group">
                            <div class="flex items-center gap-3 flex-1">
                                <div class="relative flex items-center">
                                    <input type="checkbox" ${todo.completed ? 'checked' : ''} 
                                        onclick="toggleTodo(${todo.id})"
                                        class="custom-checkbox absolute opacity-0 w-5 h-5 cursor-pointer z-10">
                                    <div class="checkbox-visual w-5 h-5 border-2 border-slate-200 rounded-full transition-all"></div>
                                </div>
                                <span class="text-[15px] font-medium transition-all ${todo.completed ? 'completed' : 'text-slate-700'}">${todo.title}</span>
                            </div>
                            <div class="action-buttons flex items-center gap-1">
                                <button onclick="editTodo(${todo.id}, '${todo.title}')" class="p-1.5 text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 transition-all rounded-lg">
                                    <i data-lucide="edit-3" class="w-4 h-4"></i>
                                </button>
                                <button onclick="deleteTodo(${todo.id})" class="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 transition-all rounded-lg">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                        
                        <!-- Sub-todo list -->
                        <div class="ml-8 mt-1 space-y-1 border-l-2 border-slate-50 pl-4">
                            <div id="subTodos-${todo.id}" class="space-y-1">
                `;

                if (todo.subTodos) {
                    todo.subTodos.forEach(sub => {
                        html += `
                            <div class="flex items-center justify-between py-1 group/sub">
                                <span class="text-sm text-slate-500 flex-1">- ${sub.content}</span>
                                <button onclick="deleteSubTodo(${sub.id})" class="opacity-0 group-hover/sub:opacity-100 p-1 text-slate-300 hover:text-rose-500 transition-all">
                                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        `;
                    });
                }

                html += `
                            </div>
                            <!-- Add Sub-todo Input -->
                            <div class="flex items-center gap-2 mt-2 opacity-60 hover:opacity-100 transition-opacity">
                                <input type="text" id="subInput-${todo.id}" 
                                    placeholder="Add sub-task..." 
                                    class="bg-transparent border-none p-0 text-sm focus:ring-0 placeholder:text-slate-300 w-full">
                                <button onclick="addSubTodo(${todo.id})" class="text-indigo-500 hover:text-indigo-600">
                                    <i data-lucide="plus" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;

                li.innerHTML = html;
                list.appendChild(li);
            });
            
            // Re-initialize Lucide icons
            lucide.createIcons();
        }

        async function addSubTodo(todoId) {
            const input = document.getElementById(`subInput-${todoId}`);
            if (!input.value) return;
            await fetch(`${API_URL}/${todoId}/sub`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: input.value, completed: false })
            });
            input.value = '';
            fetchTodos();
        }

        async function deleteSubTodo(id) {
            await fetch(`${API_URL}/sub/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        async function editTodo(id, currentTitle) {
            // Using a simple prompt for now, could be upgraded to a modal
            const newTitle = prompt('Edit task title:', currentTitle);
            if (!newTitle || newTitle === currentTitle) return;

            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: newTitle })
            });
            fetchTodos();
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            if (!input.value) return;
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value, completed: false })
            });
            input.value = '';
            fetchTodos();
        }

        async function toggleTodo(id) {
            await fetch(`${API_URL}/${id}`, { method: 'PATCH' });
            fetchTodos();
        }

        async function deleteTodo(id) {
            if (confirm('Delete this task?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchTodos();
            }
        }

        // Initialize
        updateDate();
        fetchTodos();

        // Listen for Enter key on inputs
        document.getElementById('todoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });
    </script>
</body>
</html>
