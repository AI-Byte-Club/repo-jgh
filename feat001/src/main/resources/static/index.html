<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>바이브 코딩 Todo List</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; padding-top: 50px; background-color: #f4f4f9; }
        .container { width: 400px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 15px; background-color: #5c67f2; color: white; border: none; border-radius: 4px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { display: flex; flex-direction: column; padding: 10px; border-bottom: 1px solid #eee; }
        .todo-main { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .sub-todo-list { margin-left: 30px; margin-top: 10px; font-size: 0.9em; color: #555; }
        .sub-todo-item { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .sub-input-group { margin-left: 30px; margin-top: 5px; display: flex; gap: 5px; }
        .sub-input-group input { padding: 4px; font-size: 0.8em; }
        .sub-input-group button { padding: 4px 8px; font-size: 0.8em; background-color: #28a745; }
        .completed { text-decoration: line-through; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Todo List</h2>
        <div class="input-group">
            <input type="text" id="todoInput" placeholder="큰 주제를 입력하세요">
            <button onclick="addTodo()">추가</button>
        </div>
        <ul id="todoList"></ul>
    </div>

    <script>
        const API_URL = 'http://localhost:8081/api/todos';

        async function fetchTodos() {
            const res = await fetch(API_URL);
            const todos = await res.json();
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach(todo => {
                const li = document.createElement('li');
                
                // 메인 Todo 레이아웃
                let html = `
                    <div class="todo-main">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <input type="checkbox" ${todo.completed ? 'checked' : ''} onclick="toggleTodo(${todo.id})">
                            <span class="${todo.completed ? 'completed' : ''}" style="font-weight:bold;">${todo.title}</span>
                        </div>
                        <div>
                            <button onclick="editTodo(${todo.id}, '${todo.title}')" style="background-color:#ffc107; margin-right:5px;">수정</button>
                            <button onclick="deleteTodo(${todo.id})" style="background-color:#ff4d4d">삭제</button>
                        </div>
                    </div>
                    <div class="sub-todo-list">
                `;

                // 서브 Todo 목록
                if (todo.subTodos) {
                    todo.subTodos.forEach(sub => {
                        html += `
                            <div class="sub-todo-item">
                                <span>- ${sub.content}</span>
                                <button onclick="deleteSubTodo(${sub.id})" style="background-color:transparent; color:red; border:none; cursor:pointer; font-size:0.8em;">[x]</button>
                            </div>
                        `;
                    });
                }

                // 서브 Todo 입력창
                html += `
                    </div>
                    <div class="sub-input-group">
                        <input type="text" id="subInput-${todo.id}" placeholder="작은 주제 추가">
                        <button onclick="addSubTodo(${todo.id})">추가</button>
                    </div>
                `;

                li.innerHTML = html;
                list.appendChild(li);
            });
        }

        async function addSubTodo(todoId) {
            const input = document.getElementById(`subInput-${todoId}`);
            if (!input.value) return;
            await fetch(`${API_URL}/${todoId}/sub`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: input.value, completed: false })
            });
            input.value = '';
            fetchTodos();
        }

        async function deleteSubTodo(id) {
            await fetch(`${API_URL}/sub/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        async function editTodo(id, currentTitle) {
            const newTitle = prompt('수정할 내용을 입력하세요:', currentTitle);
            if (!newTitle || newTitle === currentTitle) return;

            await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: newTitle })
            });
            fetchTodos();
        }

        async function addTodo() {
            const input = document.getElementById('todoInput');
            if (!input.value) return;
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: input.value, completed: false })
            });
            input.value = '';
            fetchTodos();
        }

        async function toggleTodo(id) {
            await fetch(`${API_URL}/${id}`, { method: 'PATCH' });
            fetchTodos();
        }

        async function deleteTodo(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        fetchTodos();
    </script>
</body>
</html>
